<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gi-Mart</title><link rel="stylesheet" href="style.css"></head><body><div class="container"><h1>Gi-Mart</h1><h3>Umang Pride, Wagholi</h3><form id="f">
<label>Title</label><select id="title"><option>Mr.</option><option>Miss</option><option>Mrs.</option></select>
<label>Name*</label><input id="namez" required oninput="this.value=this.value.toUpperCase()">
<label>Permanent Address*</label><textarea id="paddr" required oninput="this.value=this.value.toUpperCase()"></textarea>
<label>Permanent City*</label><select id="pcity"></select>
<label>Permanent Country*</label><select id="pcountry"></select>
<label>Present Address*</label><textarea id="caddr" required oninput="this.value=this.value.toUpperCase()"></textarea>
<label>Present City*</label><select id="ccity"></select>
<label>Present Country*</label><select id="ccountry"></select>
<label>DOB*</label><input type="date" id="dob" required>
<label>Email*</label><input type="email" id="email" oninput="this.value=this.value.toLowerCase()" required>
<label>Mobile*</label><div><input id="code" readonly><input id="mobile" required></div>
<div id="items"></div>
<button>Submit</button></form><pre id="out"></pre></div><script src="script.js"></script></body></html>
